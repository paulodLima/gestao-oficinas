name: gestao-oficinas

services:
  postgres:
    image: postgres:17-alpine
    container_name: oficinas-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oficinas}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - oficinas-network
    restart: unless-stopped

  api:
    build:
      context: ../oficinas-api
      dockerfile: Dockerfile
    container_name: oficinas-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-oficinas}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: oficinas@local.test
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4200}
      SERVER_PORT: 8080
      APP_AUTH_TRUSTED_PROXY_HOST: app
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - oficinas-network
    restart: unless-stopped

  app:
    build:
      context: ../oficinas-app
      dockerfile: Dockerfile
    container_name: oficinas-app
    environment:
      PORT: 4000
      API_URL: http://api:8080
    ports:
      - "${APP_PORT:-4200}:4000"
    depends_on:
      - api
    networks:
      - oficinas-network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - oficinas-network
    restart: unless-stopped

networks:
  oficinas-network:
    driver: bridge

volumes:
  postgres-data:
